name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run evaluate
      # Offline protocol conformance against a local stub. Proves the suite and
      # the transport only; never a hosted or paid provider.
      - run: npm run conformance:smoke
      - run: npm pack --dry-run
